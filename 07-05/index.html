<!DOCTYPE html>
<!--
    lang indica a linguagem da página
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title mostra o  titulo da pagina no navegador -->
    <title>Minha-pagina</title>
    <link rel="stylesheet" href="./assist/styles/index.css">
</head>
<!-- body é a tag que envolve tudo que aparece na minha pagina-->
<body>
    <h1>Titulo principal</h1>

     <h2>Subtitulo</h2>
     <p>Na tarde de hoje homem assalta padaria</p>
    <h3>Ele era conhecido do dono</h3>
     <h3>Subtitulo do subtitulo</h3>

     <h2
     class = "fundo-verde"> Cachorro sumiu
        
     </h2>

     <!--a é a tag de link-->
     <!--toda tad tem propriedades
       são os itens em 
    -->
    <a href="http://github.com/"">Clique aqui</a>

    <!--img é a tag de imagem-->
    <!-- src é onde colocamos o link de imagem-->
    <!-- alt é o texto curto descritivo de imagem-->

    <!-- Usando uma imagem via link-->
   
    <img src="https://th.bing.com/th/id/R.faacc3c775a1865204579d59177a2a58?rik=fwCbRhSPRtQfAw&riu=http%3a%2f%2fwww.pixelstalk.net%2fwp-content%2fuploads%2f2016%2f05%2fHd-CR7-Wallpapers-HD-Desktop.jpg&ehk=dFH0J%2fKq%2bcWdxTII5Ct9C%2bL%2fo4JOHpKU%2fcws0hVPiV0%3d&risl=&pid=ImgRaw&r=0" alt="Cristiano Ronaldo">

    <!-- ul é a tag de lista não ordenada-->
    <ul>
        <!-- li é a tag que representa cada item da lista-->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- ol é a tag da lista ordenada-->
    <ol>
        <li>Item</li>
        <li>Outro item</li>
        <li>Mais um item</li>
    </ol>

    <!-- button é a tag de botão-->
    <button>Clique aqui</button>
</body>
</html>
