<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
         <!-- input de texto-->
         <label for="username">Nome</label>
        <input name ="username" type="text" placeholder="Insira seu nome">
         
          <label for="email">Email</label>
          <input type="email" name="email" id="" placeholder="Insira seu email">

          <label for="password">Senha</label>
          <input type="password" name="password" id="" placeholder="Insira uma senha">

          <label for="interesse">Interesse</label>
          <input type="checkbox" name="interesse" id="" value="html">HTML
          <input type="checkbox" name="interesse" id="" value="css">HTML
          <input type="checkbox" name="interesse" id="" value="javascript">HTML

          <label for="genero">Genero</label>
          <input type="radio" name="genero" id="" value="masculino">Masculino
          <input type="radio" name="genero" id="" value="feminino">Feminino
          <input type="radio" name="genero" id="" value="prefiro nao informar">Prefiro nao informar

          <label for="curso">Curso desejado:</label><br>
          <select id="curso" name="curso">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="js">JavaScript</option>
          </select><br><br>

          <label for="comentario">Comentario</label>
          <textarea name="comentario" id="" cols="30" rows="10" placeholder="Insira seu comentario"></textarea>

          <button type="submit">Enviar</button>
          
    </form>
</body>
</html>
