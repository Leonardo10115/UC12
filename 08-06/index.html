    <!-- TELA DO QUIZ -->
    <div id="tela-quiz" class="tela ativa">
        <div class="quiz-container">
            <header class="quiz-header">
                <div class="progresso-info">
                    <span id="numero-pergunta">Pergunta 1 de 10</span>
                    <span id="placar-atual"><i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> 0 pts</span>

                </div>
                <div class="barra-progresso">
                    <div id="barra-fill" class="barra-fill"></div>
                </div>
            </header>

            <main class="quiz-main">
                <div class="pergunta-card">
                    <p id="categoria-badge" class="categoria-badge">HTML</p>
                    <h2 id="texto-pergunta">Texto pergunta</h2>

                </div>

                <div id="opcoes-container" class="opcoes-container">
                    <!-- Opções que vão ser geradas pelo JS -->
                </div>

                <div id="feedback" class="feedback escondido">
                    <div id="feedback-icone"></div>
                    <p id="feedback-texto"></p>
                </div>
            </main>

            <footer class="quiz-footer">
                <button id="btn-proxima" class="btn-primario escondido">
                    Próxima <i class="fa-solid fa-arrow-right" style="color: rgb(255, 255, 255);"></i>
                </button> 
            </footer>
        </div>
    </div>


    <!-- TELA DE RESULTADO -->
    <div id="tela-resultado" class="tela">
     <div class="resultado-container">
        <div id="resultado-emoji" class="resultado-emoji"></div>
        <h2 id="resultado-titulo"></h2>
        <p id="resultado-descricao"></p>

        <div class="placar-final"></div>
     </div>

     <div id="revisao-container" class="resultado-container"></div>

     <button id="btn-reiniciar" class="btn-primario"></button>
    </div>



    <script src="assets/scripts/index.js"></script>
</body>
